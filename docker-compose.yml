services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventauri}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - inventauri_pg:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5

  pocketbase:
    image: ghcr.io/muchobien/pocketbase:0.22.11
    restart: unless-stopped
    env_file:
      - .env.docker
    entrypoint: []
    command:
      - /usr/local/bin/pocketbase
      - serve
      - --http=0.0.0.0:8090
      - --https=
      - --dir=/pb_data
      - --publicDir=/pb_public
      - --migrationsDir=/pb_migrations
      - --automigrate
    ports:
      - '8090:8090'
    volumes:
      - inventauri_pb_data:/pb_data
      - inventauri_pb_public:/pb_public
      - ./pocketbase:/pb_migrations:ro
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:8090/api/health']
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      PORT: 4321
      HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      pocketbase:
        condition: service_healthy
    ports:
      - '4321:4321'

volumes:
  inventauri_pg:
  inventauri_pb_data:
  inventauri_pb_public:
