version: 1

backend:
  phases:
    build:
      commands:
        # Dependencies für das Backend
        - npm ci --cache .npm --prefer-offline
        # Amplify Backend (Data/Auth/Storage) deployen
        - npx ampx pipeline-deploy --branch "$AWS_BRANCH" --app-id "$AWS_APP_ID"
  artifacts:
    baseDirectory: .
    files:
      - amplify_outputs.json
  cache:
    paths:
      - '.npm/**/*'

frontend:
  phases:
    preBuild:
      commands:
        # Dependencies fürs Frontend
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # Astro Build (mit adapter astro-aws-amplify)
        - npm run build
        # compute-node_modules an den erwarteten Ort verschieben
        - mv node_modules ./.amplify-hosting/compute/default
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - '**/*'
  cache:
    paths:
      - '.npm/**/*'
