version: 1

backend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npx ampx pipeline-deploy --branch "$AWS_BRANCH" --app-id "$AWS_APP_ID"
  artifacts:
    baseDirectory: .
    files:
      - amplify_outputs.json

frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
        # Reinstall runtime-only deps to keep compute bundle small
        - rm -rf node_modules
        - npm ci --omit=dev --omit=optional --no-audit --no-fund
        - npm dedupe
        # Replace only the compute node_modules to avoid deleting adapter output (entry.mjs)
        - rm -rf ./.amplify-hosting/compute/default/node_modules
        - mv node_modules ./.amplify-hosting/compute/default/node_modules
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - '**/*'
  cache:
    paths:
      - '.npm/**/*'
