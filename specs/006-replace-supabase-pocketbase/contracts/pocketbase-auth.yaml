openapi: 3.1.0
info:
  title: Inventauri PocketBase Auth & Inventory Contract
  version: 0.1.0
  description: >
    Contract describing PocketBase-backed authentication endpoints and the tenant-scoped
    authorization rules for existing inventory APIs after replacing Supabase.
servers:
  - url: http://localhost:4321
security:
  - PocketBaseAuth: []
components:
  securitySchemes:
    PocketBaseAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
    LoginResponse:
      type: object
      required: [user, accessToken, refreshToken, expiresAt]
      properties:
        user:
          type: object
          required: [id, email, profile]
          properties:
            id:
              type: string
              description: PocketBase user id (ULID)
            email:
              type: string
              format: email
            profile:
              type: object
              required: [shopId, userShopId, role]
              properties:
                shopId:
                  type: string
                  format: uuid
                userShopId:
                  type: string
                  format: uuid
                role:
                  type: string
                  enum: [owner, manager, staff]
        accessToken:
          type: string
          description: PocketBase JWT (short-lived)
        refreshToken:
          type: string
          description: Token persisted in HttpOnly cookie
        expiresAt:
          type: string
          format: date-time
    SessionResponse:
      type: object
      required: [user, sessionValid, expiresAt]
      properties:
        sessionValid:
          type: boolean
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/LoginResponse/properties/user'
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

paths:
  /api/auth/login:
    post:
      summary: Authenticate against PocketBase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful login
          headers:
            Set-Cookie:
              schema:
                type: string
              description: >
                Sets `pb-access-token` (HttpOnly, Secure) and `pb-refresh-token`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/logout:
    post:
      summary: Revoke PocketBase session and clear cookies
      security: []
      responses:
        '204':
          description: Session revoked. Cookies cleared.

  /api/auth/session:
    get:
      summary: Validate current PocketBase session cookies
      responses:
        '200':
          description: Session info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          description: Session invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/items:
    post:
      summary: Create an inventory item scoped to the caller's PocketBase tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, sku]
              properties:
                name:
                  type: string
                sku:
                  type: string
                unit:
                  type: string
                  default: stk
                warehouseId:
                  type: string
                  format: uuid
                initialStock:
                  type: integer
                  minimum: 0
                metadata:
                  type: object
      responses:
        '201':
          description: Item created for the tenant tied to the PocketBase token
          content:
            application/json:
              schema:
                type: object
                required: [item, stockLevel, snapshot]
                properties:
                  item:
                    type: object
                  stockLevel:
                    type: object
                    nullable: true
                  snapshot:
                    type: object
                    description: Tenant-scoped inventory snapshot
        '401':
          description: Missing/invalid PocketBase token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: User not mapped to requested tenant or warehouse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/stock/transfer:
    post:
      summary: Transfer stock between warehouses (tenant-scoped)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - itemId
                - sourceWarehouseId
                - targetWarehouseId
                - quantity
              properties:
                itemId:
                  type: string
                  format: uuid
                sourceWarehouseId:
                  type: string
                  format: uuid
                targetWarehouseId:
                  type: string
                  format: uuid
                quantity:
                  type: number
                  exclusiveMinimum: 0
                reference:
                  type: string
                notes:
                  type: string
      responses:
        '200':
          description: Transfer recorded with updated tenant snapshot
          content:
            application/json:
              schema:
                type: object
                required: [result, snapshot]
                properties:
                  result:
                    type: object
                    properties:
                      transactionId:
                        type: string
                      itemId:
                        type: string
                      updatedWarehouses:
                        type: array
                        items:
                          type: object
                          properties:
                            warehouseId:
                              type: string
                            quantityOnHand:
                              type: number
                            quantityReserved:
                              type: number
                  snapshot:
                    type: object
        '401':
          description: Missing/invalid PocketBase token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Caller not authorized for item/warehouse/tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
